# /etc/nginx/sites-available/reef.conf
#
# Live copy after certbot. Behind Cloudflare in proxy mode, so the origin
# certificate is what Cloudflare validates against — it must match the
# hostname, which is why renaming the DNS record also required a new cert.

server {
    if ($host = reef.nimiq.cafe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name reef.nimiq.cafe;
  location / {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/proxy_params;
  }


}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name reef.nimiq.cafe;

  # Placeholder: the reef certificate, wrong hostname. Cloudflare connects to
  # the origin over HTTPS, so something must answer on 443 for this name before
  # an HTTP-01 challenge can reach us at all.
    ssl_certificate /etc/letsencrypt/live/reef.nimiq.cafe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reef.nimiq.cafe/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/proxy_params;
  }

}
