# /etc/nginx/sites-available/grove.conf
#
# Certbot rewrites this file when it installs the certificate; keep the plain
# :80 server here so the HTTP-01 challenge can complete on first issue.
server {
  listen 80;
  listen [::]:80;
  server_name grove.nimiq.cafe;

  location / {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
