# /etc/nginx/sites-available/grove.conf
#
# Live copy, after certbot installed the certificate. Behind Cloudflare in
# proxy mode, so the origin cert is what Cloudflare validates against — keep
# it real rather than self-signed, which is what lets SSL mode be tightened
# to Full (strict).
#
# Regenerate with: ssh $GROVE_SSH 'cat /etc/nginx/sites-available/grove.conf'

server {
    if ($host = grove.nimiq.cafe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name grove.nimiq.cafe;
  location / {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/proxy_params;
  }


}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name grove.nimiq.cafe;

  # PLACEHOLDER cert — replaced by certbot once HTTP-01 can complete.
    ssl_certificate /etc/letsencrypt/live/grove.nimiq.cafe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grove.nimiq.cafe/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://127.0.0.1:3200;
    include /etc/nginx/proxy_params;
  }

}
